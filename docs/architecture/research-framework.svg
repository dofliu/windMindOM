<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 812" width="1130" height="812" role="img" aria-label="仿真風場一次產生兩份東西：看得到的資料往右給對外 API、工單與準備卡、可用率與成本；故障真相往下另存，只給研究者端的自動評分。">
  
    <style>
text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif; }
.zone { fill: #e3e9ef; stroke: #c2ccd6; stroke-width: 1; }
.farm { fill: #f6f8fa; stroke: #4a5866; stroke-width: 1.2; }
.bx { fill: #ffffff; stroke: #4a5866; stroke-width: 1.2; }
.bn { fill: #ffffff; stroke: #a65a00; stroke-width: 1.6; stroke-dasharray: 6 4; }
.bh { fill: #ffffff; stroke: #a52a46; stroke-width: 1.8; }
.bf { fill: none; stroke: #64717e; stroke-width: 1.2; stroke-dasharray: 2 4; }
.ar { fill: none; stroke: #17212b; stroke-width: 1.4; }
.arh { fill: none; stroke: #a52a46; stroke-width: 2; }
.arf { fill: none; stroke: #64717e; stroke-width: 1.2; stroke-dasharray: 2 4; }
.mk { fill: #17212b; } .mkh { fill: #a52a46; } .mkf { fill: #64717e; }
.t { font-size: 13.5px; font-weight: 700; fill: #17212b; }
.t13 { font-size: 13px; font-weight: 700; fill: #17212b; }
.tf { font-size: 13.5px; font-weight: 700; fill: #64717e; }
.s { font-size: 11.5px; fill: #64717e; }
.l { font-size: 11.5px; fill: #17212b; }
.lh { font-size: 11.5px; font-weight: 700; fill: #a52a46; }
.lf { font-size: 11.5px; fill: #64717e; }
.zl { font-size: 12px; font-weight: 700; fill: #4a5866; letter-spacing: 0.06em; }
.bg { fill: #a65a00; }
.bt { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; font-family: ui-monospace, Menlo, Consolas, monospace; }
    </style>
    <rect x="0" y="0" width="1130" height="812" fill="#ffffff"/>
  <defs>
    <marker id="rf-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
    <marker id="rf-mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkh"/></marker>
    <marker id="rf-mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkf"/></marker>
  </defs>

  <!-- windMindOM 範圍 -->
  <rect class="zone" x="16" y="124" width="829" height="576" rx="14"/>
  <text class="zl" x="829" y="147" text-anchor="end">windMindOM 仿真運維風場</text>

  <!-- 上方：系統之外 -->
  <rect class="bx" x="36" y="20" width="300" height="84" rx="6"/>
  <text class="t" x="52" y="42">風場設定（研究者給定）</text>
  <text class="s" x="52" y="61">風況與環境：季節、日夜、紊流、實測序列</text>
  <text class="s" x="52" y="77">故障與耗損：發生率、種類、機組</text>
  <text class="s" x="52" y="93">風場：Z72 機組、手冊設定值、警報目錄</text>
  <circle class="bg" cx="322" cy="20" r="9"/><text class="bt" x="322" y="24">7</text>

  <rect class="bf" x="410" y="36" width="180" height="60" rx="6"/>
  <text class="tf" x="426" y="60">真實風場（日後）</text>
  <text class="s" x="426" y="79">有機會介接時再驗證</text>

  <rect class="bx" x="900" y="180" width="210" height="80" rx="6"/>
  <text class="t" x="916" y="206">外部 RAG 運維助理</text>
  <text class="s" x="916" y="226">另行開發，不在本系統內</text>
  <text class="s" x="916" y="243">只靠對外 API 取資料</text>

  <!-- 仿真風場 -->
  <rect class="farm" x="36" y="164" width="300" height="436" rx="10"/>
  <text class="t" x="52" y="188">仿真風場（持續運轉）</text>

  <rect class="bx" x="60" y="204" width="252" height="66" rx="6"/>
  <text class="t" x="76" y="229">故障產生器</text>
  <text class="s" x="76" y="250">手動與排程已有，機率式待建</text>
  <circle class="bg" cx="298" cy="204" r="9"/><text class="bt" x="298" y="208">5</text>

  <rect class="bx" x="60" y="306" width="252" height="74" rx="6"/>
  <text class="t" x="76" y="330">物理模型</text>
  <text class="s" x="76" y="350">氣動、傳動鏈、熱、冷卻、振動</text>
  <text class="s" x="76" y="366">疲勞、偏航、電網</text>

  <rect class="bx" x="60" y="416" width="252" height="74" rx="6"/>
  <text class="t" x="76" y="440">PLC 保護層</text>
  <text class="s" x="76" y="460">依 Z72 手冊設定值判定</text>
  <text class="s" x="76" y="476">送出警報碼、跳機</text>

  <rect class="bx" x="60" y="524" width="252" height="58" rx="6"/>
  <text class="t" x="76" y="548">機組狀態</text>
  <text class="s" x="76" y="567">發電、停機、故障鎖定</text>

  <path class="ar" d="M186,104 V162" marker-end="url(#rf-m)"/>
  <text class="l" x="196" y="142">套用設定</text>
  <path class="ar" d="M186,270 V304" marker-end="url(#rf-m)"/>
  <text class="l" x="196" y="292">注入故障與耗損</text>
  <path class="ar" d="M186,380 V414" marker-end="url(#rf-m)"/>
  <text class="l" x="196" y="402">製程訊號</text>
  <path class="ar" d="M186,490 V522" marker-end="url(#rf-m)"/>
  <text class="l" x="196" y="511">跳機、鎖定</text>

  <!-- 看得到的資料 -->
  <rect class="bx" x="412" y="190" width="176" height="110" rx="6"/>
  <text class="t" x="428" y="214">資料循環保存</text>
  <text class="s" x="428" y="234">10 秒讀值、10 分鐘統計</text>
  <text class="s" x="428" y="251">警報與事件、運轉狀態</text>
  <text class="s" x="428" y="268">現況只留 3 天</text>
  <text class="s" x="428" y="285">目標留半年，到期刪最舊</text>
  <circle class="bg" cx="574" cy="190" r="9"/><text class="bt" x="574" y="194">2</text>

  <path class="ar" d="M336,240 H410" marker-end="url(#rf-m)"/>
  <text class="l" x="373" y="232" text-anchor="middle">讀值與事件</text>
  <path class="arf" d="M500,96 V188" marker-end="url(#rf-mf)"/>
  <text class="lf" x="508" y="162">真實資料</text>

  <!-- 對外 API -->
  <rect class="bn" x="640" y="190" width="170" height="60" rx="6"/>
  <text class="t" x="656" y="214">對外唯讀 API</text>
  <text class="s" x="656" y="234">只給看得到的資料與警報</text>
  <circle class="bg" cx="796" cy="190" r="9"/><text class="bt" x="796" y="194">1</text>
  <path class="ar" d="M588,220 H638" marker-end="url(#rf-m)"/>
  <text class="l" x="613" y="212" text-anchor="middle">讀取</text>
  <path class="ar" d="M810,220 H898" marker-end="url(#rf-m)"/>
  <text class="l" x="855" y="212" text-anchor="middle">REST、OPC UA</text>

  <!-- 可用率與成本 -->
  <rect class="bx" x="412" y="368" width="176" height="58" rx="6"/>
  <text class="t13" x="428" y="392">可用率、停機、發電量</text>
  <text class="s" x="428" y="411">由運轉狀態計算</text>
  <circle class="bg" cx="574" cy="368" r="9"/><text class="bt" x="574" y="372">3</text>
  <path class="ar" d="M462,300 V366" marker-end="url(#rf-m)"/>
  <text class="l" x="470" y="352">運轉狀態</text>

  <rect class="bx" x="412" y="456" width="176" height="70" rx="6"/>
  <text class="t" x="428" y="480">成本計算</text>
  <text class="s" x="428" y="499">發電收入、停機損失</text>
  <text class="s" x="428" y="515">維修支出</text>
  <circle class="bg" cx="574" cy="456" r="9"/><text class="bt" x="574" y="460">6</text>
  <path class="ar" d="M462,426 V454" marker-end="url(#rf-m)"/>
  <text class="l" x="470" y="445">發電量、停機</text>

  <!-- 運維閉環 -->
  <path class="ar" d="M548,300 V332 H638" marker-end="url(#rf-m)"/>
  <circle class="bg" cx="564" cy="317" r="8"/><text class="bt" x="564" y="321">3</text>
  <text class="l" x="577" y="321">警報開單</text>

  <rect class="bx" x="640" y="302" width="170" height="60" rx="6"/>
  <text class="t" x="656" y="326">工單</text>
  <text class="s" x="656" y="346">警報或定檢排程開出</text>

  <path class="ar" d="M725,362 V410" marker-end="url(#rf-m)"/>
  <text class="l" x="735" y="391">建單時產生</text>

  <rect class="bn" x="640" y="412" width="170" height="60" rx="6"/>
  <text class="t" x="656" y="436">出發前準備卡</text>
  <text class="s" x="656" y="456">整理證據，不判定原因</text>
  <circle class="bg" cx="796" cy="412" r="9"/><text class="bt" x="796" y="416">4</text>

  <path class="ar" d="M725,472 V520" marker-end="url(#rf-m)"/>
  <text class="l" x="735" y="501">出發前查看</text>

  <rect class="bx" x="640" y="522" width="170" height="60" rx="6"/>
  <text class="t" x="656" y="546">維修與定檢</text>
  <text class="s" x="656" y="566">人員，或模擬維修班</text>
  <circle class="bg" cx="796" cy="522" r="9"/><text class="bt" x="796" y="526">5</text>

  <path class="ar" d="M640,552 H314" marker-end="url(#rf-m)"/>
  <circle class="bg" cx="366" cy="540" r="8"/><text class="bt" x="366" y="544">3</text>
  <text class="l" x="380" y="544">完工才修復：清故障、解鎖、復位</text>

  <!-- 故障真相：不對外 -->
  <path class="arh" d="M186,600 V634" marker-end="url(#rf-mh)"/>
  <text class="lh" x="196" y="622">每筆故障的真正原因</text>
  <rect class="bh" x="36" y="636" width="300" height="52" rx="6"/>
  <text class="t" x="52" y="658">故障真相紀錄（不對外）</text>
  <text class="s" x="52" y="676">哪台、何時、什麼故障、重點訊號</text>
  <circle class="bg" cx="322" cy="636" r="9"/><text class="bt" x="322" y="640">5</text>
  <path class="arh" d="M336,662 H384 V734" marker-end="url(#rf-mh)"/>
  <text class="lh" x="392" y="722">只給評分端</text>

  <!-- 題庫 -->
  <rect class="bx" x="420" y="636" width="200" height="52" rx="6"/>
  <text class="t13" x="436" y="658">題庫：凍結情境＋標準答案</text>
  <text class="s" x="436" y="676">已完成，可重複評分</text>
  <path class="ar" d="M520,688 V734" marker-end="url(#rf-m)"/>
  <text class="l" x="528" y="722">重複測驗</text>

  <!-- 送去評分 -->
  <path class="ar" d="M810,442 H828 V734" marker-end="url(#rf-m)"/>
  <text class="l" x="820" y="722" text-anchor="end">準備卡的內容</text>
  <path class="ar" d="M1005,260 V734" marker-end="url(#rf-m)"/>
  <text class="l" x="997" y="722" text-anchor="end">助理的診斷與摘要</text>

  <rect class="bn" x="360" y="736" width="750" height="60" rx="6"/>
  <text class="t" x="376" y="760">自動評分（研究者端）</text>
  <text class="s" x="376" y="780">對照故障真相：有沒有指到重點訊號、有沒有把健康機組當成故障、缺資料時有沒有保留判斷</text>
  <circle class="bg" cx="1096" cy="736" r="9"/><text class="bt" x="1096" y="740">4</text>
</svg>
