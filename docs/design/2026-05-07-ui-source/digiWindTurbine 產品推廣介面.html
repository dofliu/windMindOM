<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>digiWindTurbine — 產品推廣介面三種選項</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: #1a1a1a;
    color: #fff;
  }
  * { box-sizing: border-box; }
  /* Hide scrollbars inside artboards */
  .artboard-content::-webkit-scrollbar { width: 0; height: 0; }
  /* The variants are full-page; cap inside artboards */
  .v-frame { width: 100%; min-height: 1600px; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="shared/i18n.js"></script>
<script type="text/babel" src="shared/MiniDashboard.jsx"></script>
<script type="text/babel" src="variants/V1.jsx"></script>
<script type="text/babel" src="variants/V2.jsx"></script>
<script type="text/babel" src="variants/V3.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  const App = () => (
    <DesignCanvas
      title="digiWindTurbine — 產品推廣介面"
      subtitle="三種完全不同的視覺風格 · 中英雙語 · 互動 Demo · 拖曳排序、雙擊放大"
    >
      <DCSection id="desktop" title="桌機版本　Desktop · 1440 × 2400">
        <DCArtboard id="v1" label="Option 1 · 編輯誌風格 Organic Editorial" width={1440} height={2400}>
          <div className="v-frame" style={{ height: 2400 }}>
            <window.V1 lang="zh" />
          </div>
        </DCArtboard>
        <DCArtboard id="v2" label="Option 2 · 即時儀表板 Living Dashboard" width={1440} height={2400}>
          <div className="v-frame" style={{ height: 2400 }}>
            <window.V2 lang="zh" />
          </div>
        </DCArtboard>
        <DCArtboard id="v3" label="Option 3 · 風的花園 Garden of Wind" width={1440} height={2400}>
          <div className="v-frame" style={{ height: 2400 }}>
            <window.V3 lang="zh" />
          </div>
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile" title="手機版本　Mobile preview · 390 × 844 (Hero only)">
        <DCArtboard id="v1m" label="Option 1 · Mobile Hero" width={390} height={844}>
          <div style={{ width: 1440, height: 844 * (1440/390), transform: `scale(${390/1440})`, transformOrigin: '0 0' }}>
            <window.V1 lang="zh" />
          </div>
        </DCArtboard>
        <DCArtboard id="v2m" label="Option 2 · Mobile Hero" width={390} height={844}>
          <div style={{ width: 1440, height: 844 * (1440/390), transform: `scale(${390/1440})`, transformOrigin: '0 0' }}>
            <window.V2 lang="zh" />
          </div>
        </DCArtboard>
        <DCArtboard id="v3m" label="Option 3 · Mobile Hero" width={390} height={844}>
          <div style={{ width: 1440, height: 844 * (1440/390), transform: `scale(${390/1440})`, transformOrigin: '0 0' }}>
            <window.V3 lang="zh" />
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
