<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>WMOM · App UI Variants</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Inter+Tight:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a1a; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app/VA.jsx"></script>
<script type="text/babel" src="app/VB.jsx"></script>
<script type="text/babel" src="app/VC.jsx"></script>

<script type="text/babel">
const { useState } = React;

const PageSwitcher = ({ pageId, setPageId, lang, setLang, accent = '#3F6B53', bg = '#FFF', text = '#1F2D24', border = '#E5E0D2' }) => {
  const pages = window.WMOM_APP.pages;
  return (
    <div style={{
      position: 'absolute', top: 12, right: 12, zIndex: 100,
      background: bg, border: `1px solid ${border}`, borderRadius: 999, padding: 4,
      display: 'flex', gap: 2, alignItems: 'center', fontFamily: 'Manrope, system-ui, sans-serif',
      boxShadow: '0 4px 18px rgba(0,0,0,0.18)'
    }}>
      {pages.map(p => (
        <button key={p.id} onClick={(e) => { e.stopPropagation(); setPageId(p.id); }} style={{
          padding: '6px 12px', fontSize: 11, fontWeight: 600, border: 'none', borderRadius: 999, cursor: 'pointer',
          background: pageId === p.id ? accent : 'transparent',
          color: pageId === p.id ? '#FFF' : text, fontFamily: 'inherit'
        }}>{lang === 'zh' ? p.zh : p.en}</button>
      ))}
      <div style={{ width: 1, height: 20, background: border, margin: '0 4px' }}></div>
      <button onClick={(e) => { e.stopPropagation(); setLang(lang === 'zh' ? 'en' : 'zh'); }} style={{
        padding: '6px 10px', fontSize: 11, fontWeight: 600, border: 'none', borderRadius: 999, cursor: 'pointer',
        background: 'transparent', color: text, fontFamily: 'inherit'
      }}>{lang === 'zh' ? 'EN' : '中'}</button>
    </div>
  );
};

const ArtboardWrap = ({ Variant, switchProps, initTheme }) => {
  const [pageId, setPageId] = useState('overview');
  const [lang, setLang] = useState('zh');
  return (
    <div style={{ width: '100%', height: '100%', position: 'relative' }}>
      <PageSwitcher pageId={pageId} setPageId={setPageId} lang={lang} setLang={setLang} {...switchProps}/>
      <div style={{ width: '100%', height: '100%', overflow: 'auto' }}>
        <Variant key={pageId + lang + (initTheme||'')} page={pageId} lang={lang} theme={initTheme}/>
      </div>
    </div>
  );
};

const App = () => {
  return (
    <DesignCanvas defaultZoom={0.55}>
      <DCSection id="primary" title="A · Calm Operator（主推）" subtitle="鼠尾草綠暖米白／翡翠玻璃深色，左側面板可切換主題（☀ 日／☾ 夜），右上可切換頁面與語言。">
        <DCArtboard id="va-light" label="A · 日間（鼠尾草綠 + 暖米白）" width={1440} height={1100}>
          <ArtboardWrap Variant={window.VA} initTheme="light" switchProps={{ accent: '#3F6B53', bg: '#FFF', text: '#1F2D24', border: '#E5E0D2' }}/>
        </DCArtboard>
        <DCArtboard id="va-dark" label="A · 夜間（翡翠玻璃 · 取自 C 的色系）" width={1440} height={1100}>
          <ArtboardWrap Variant={window.VA} initTheme="dark" switchProps={{ accent: '#3DDC97', bg: '#152320', text: '#E8F0EC', border: 'rgba(255,255,255,0.14)' }}/>
        </DCArtboard>
      </DCSection>
      <DCSection id="alts" title="參考備案" subtitle="先前的 B / C 方向保留供對照。">
        <DCArtboard id="vb" label="B · Workshop Console — 牛皮紙底 + 製圖網格" width={1440} height={1500}>
          <ArtboardWrap Variant={window.VB} switchProps={{ accent: '#1A1814', bg: '#F8F3E6', text: '#1A1814', border: '#C9BFA8' }}/>
        </DCArtboard>
        <DCArtboard id="vc" label="C · Glass Cockpit — 深森林玻璃擬態" width={1440} height={1100}>
          <ArtboardWrap Variant={window.VC} switchProps={{ accent: '#3DDC97', bg: 'rgba(20,30,28,0.95)', text: '#E8F0EC', border: 'rgba(255,255,255,0.14)' }}/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
