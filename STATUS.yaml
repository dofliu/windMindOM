next_milestone: "**WMOM-20260504-13 done — Cost 系列 fetch 加 AbortController 防 race**：今日（autonomous daily worker, 5/23 20:00）做 5/22 handoff 推薦的 0.25d frontend-only 小工。問題源於 WMOM-20260504-10 code-reviewer finding #5：`useCostData.useAsync.run` 沒有 abort 機制，React 18 Strict Mode dev 雙觸發 `useEffect([dataset])` 或使用者快速切 dataset 時，慢 fetch 後回會蓋掉新 dataset 結果（stale-overwrites-fresh race）。修法三道防線：(1) `useRef<AbortController>` 追蹤最新 in-flight request，下一筆 run 前先 abort 上一筆；(2) `signal.aborted` 早退即使舊 fetch 已 resolve 也不 setData；(3) `controllerRef.current === controller` loading guard 確保只有最新 request 結束 loading。另：`isAbortError` 接 DOMException + Error 兩種、`reset()` 也 abort + 清 loading、unmount cleanup abort。`costService.ts` 的 `postJSON` + `costApi`×4 加 optional `AbortSignal` 透傳給 fetch。純擴充，CostPage 4 panel + dataset effect 完全相容。Verify：tsc 0 errors + vite build 748 modules / 4.58s 0 errors；backend 未動（zero regression，frontend only）。frontend 無測試框架（無 vitest/jest），為 0.25d 小工不引入整套 harness — race 邏輯以 timeline 推導驗證；建議另開 issue 一次導入 vitest+RTL 再補 regression test。Code review 1 must + 1 should + 1 nice：should（isAbortError 補 DOMException）採納；must（reset 與 in-flight run 交錯疑 loading 殘留）經 timeline 推導判定**非真 bug**（reset 已 unconditional setLoading(false)；await resolve 到 finally 之間 microtask 不可被外部 callback 插入；reviewer 自己也走回頭路確認），不採納其 hacky dead-controller 寫法，改加註解文件化。M4 milestone 維持 100%；issue_stats open 15→14 / done 42→43 / total 57。下次候選：WMOM-20260519-01（F1 超量退料 domain guard，需劉老師 walkthrough — 不適合 solo session）/ M5 規劃（讀 ROADMAP M5 章節）/ WMOM-20260513-02 demo orchestrator simulator（2-3d 跨 session）/ WMOM-20260504-12 frontend 記憶體成長（0.5-1d low priority）。詳細 handoff 在 work-logs/2026-05/2026-05-23-cost-abortcontroller.md."
