next_milestone: "**WMOM-20260527-01 done — CI/baseline 技術債清理：requirements-dev.txt + cost pinned 容差比對**：今日（autonomous daily worker, 5/27 20:00）清掉 5/26 handoff §5/§6 明確點名、列為下次『順手清小工』的兩條反覆出現環境 blocker。**(1) 依賴宣告**：requirements.txt 補先前漏列但 app 實際 import 的 runtime 依賴（sqlalchemy/pandas/reportlab/jinja2）；新增 requirements-dev.txt（-r requirements.txt + pytest/pytest-asyncio/httpx），新 sandbox 一鍵就緒。查證 aiosqlite/openpyxl 全 repo 無 import → 不列。**(2) cost pinned 測試跨平台 float drift**：3 個 pinned 測試（var_fluct year_1 / monte_carlo percentiles / cost_api mc seed42）在本 sandbox 必紅，差異在 float64 最後一位。root cause 確認 = 跨平台 BLAS 累加 ULP drift（pin 在 Windows 量測、sandbox Linux+OpenBLAS；實測 numpy 1.26.4 與 2.4.6 在 Linux 下都差最後一位 → 非單純 numpy 版本，pin numpy 不足以解決）。新增 modules/cost/tests/pin_tolerance.py（pin_approx=pytest.approx rel=1e-9 abs=1e-6 / pin_equal=math.isclose）；5 個 cost 測試檔改容差比對（var_fluct/monte_carlo/k13_equivalence loop 用 pin_equal、cost_api/adapter direct-assert 用 pin_approx），刻意保留 exact == 於整數/failure_multiplier/已 round 值（跨平台確定性）。rel_tol=1e-9 守 9 位有效數字 → 真 regression 攔截力不變、只吸收 ~1e-15 平台噪音。**Verify**：cost 測試在 numpy 1.26.4 與 2.4.6 下皆 84 passed（證跨版本 robust）；完整 backend 568 passed / 1 xfailed，3 個 numpy drift 消除，唯一剩 fail 是既有 SQLite WAL flaky concurrency（單跑通過、與本 PR 無關）→ 相較先前 baseline（本 sandbox 永遠 3 紅）為嚴格改善。解決 WMOM-20260526-01 §後續技術債 1+2。issue_stats open 13 / in_progress 1 / done 44→45 / total 58→59。M4 維持 100%。下次候選：擴大元件層測試（CostPage / FarmOverview）/ WMOM-20260519-01（需劉老師會計語意決策）/ WMOM-20260513-02 demo orchestrator。詳細 handoff 在 work-logs/2026-05/2026-05-27-ci-baseline-pin-tolerance.md."
