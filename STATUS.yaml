next_milestone: "**A3 (WMOM-20260509-03) 同日完工 — MaterialRequest API + signoff 整合就位**：9 endpoints (create / list / get / submit-for-approval / dispatch / receive / close / cancel / returns) + 8 request + 3 response schema + signoff_repository 加 create_chain_for_material_request + approval_router MATERIAL_REQUEST branch (approve last step 自動 transition('approve_all') + dispatch_request atomic 雙寫；reject → REJECTED 終態) + mount 進 monitoring/server/app.py。27 new tests pass（CRUD / state transitions / 完整 approval auto-dispatch lifecycle / 簽核期間 stock 抽走的 edge case / 422-409-404 error mapping）。Workflow 318 pass / cost+workflow 375 pass + 1 xfailed (existing) — 0 regression。設計決策：submit-for-approval 先建 chain 再 transition（避免 inconsistent state）/ Approval auto-dispatch 失敗時回 200 + subject_transition_error（chain 已落地，MR 卡 APPROVED，operator 手動補 dispatch 或 cancel）/ MATERIAL_REQUEST reject 進 REJECTED 終態（vs work_order「reject 回 IN_PROGRESS」）/ dispatch error 改 'cannot transition' 字眼讓 router 正確 map 409。下一步：A4 (WMOM-20260509-04) Inventory query + adjustment API（6 endpoints，純 read + manual adjust，0.5 工作天）。"
