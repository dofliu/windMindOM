next_milestone: "**WMOM-20260525-01 done — 前端測試基礎設施（vitest + RTL）+ 回補 WS / AbortController regression test**：今日（autonomous daily worker, 5/25 20:00）做 5/24 handoff 連續 3 份點名的反覆缺口。前端先前完全無測試框架，導致 WMOM-20260504-12（WS 殭屍重連根治）/ WMOM-20260504-13（cost AbortController race）等修復都無法補 regression test。本 PR：(1) 導入 vitest 3.2.4 + @testing-library/react 16.3.2（相容 React 19）+ jsdom — vite.config.ts 改用 `vitest/config` 的 defineConfig 並加 test 區塊（globals/jsdom/setupFiles/include/exclude）、tsconfig 加 `vitest/globals` types、test/setup.ts 註冊 jest-dom matcher + afterEach cleanup、package.json 加 test/test:watch script；(2) 回補 6 個 regression test：useRealtimeData.test.ts（3 個，FakeWebSocket + fake timer 守 WS 殭屍重連——卸載後不再建新 WS / 仍掛載時 3s 重連 / onmessage 更新 turbines）+ useCostData.test.ts（3 個，mock costService 手動控制 promise 完成順序守 AbortController race——舊 fetch 後到不蓋新結果 / AbortError 不寫 error state / reset 清空並 abort in-flight）。Verify：vitest 6 pass / tsc 0 / vite build 0；backend 完全未動（565 passed / 1 xfailed / 4 pre-existing 環境性 fail，zero regression）。Mutation test：把 useRealtimeData 臨時退回原始 bug 確認「卸載後不重連」測試會 FAIL、還原後 pass → 證明測試非空轉。issue_stats done 43→44 / total 57→58（open 13 / in_progress 1 WMOM-20260504-12 不變）。M4 維持 100%。下次候選：回補更多 hook regression test / requirements-dev.txt + SessionStart hook（backend 測試依賴固定）/ WMOM-20260519-01（需劉老師 walkthrough）/ M5 規劃（RAG 需架構決策）。詳細 handoff 在 work-logs/2026-05/2026-05-25-frontend-test-infra.md.\n\n--- 前次 (in_progress) ---\n**WMOM-20260504-12 進度（in_progress）— Frontend realtime 記憶體成長：WS 殭屍重連洩漏根治 + 卡片 React.memo**：今日（autonomous daily worker, 5/24 20:00）做 5/23 handoff 推薦的 solo-friendly frontend 工。進場 root-cause 發現 issue 描述的元件名（MiniTrendChart/TurbineCard）在 5/07 UI 改版後已不存在，現況 overview 走 FarmOverview 的 TCard/CompactTile + 自寫 SVG sparkline（非 Recharts，故 suspect #3 不適用）。**真因（suspect #4）**：`useRealtimeData` 的 `ws.onclose` 無條件 `setTimeout(connect,3000)` 重連；而 unmount cleanup 呼叫 `ws.close()` 會非同步觸發 onclose，在 cleanup 跑完後又排一條清不到的重連 timer → 殭屍 WebSocket 無限累積（每條都在每次 push 呼叫 setTurbines）；React 18 Strict Mode dev 雙觸發立刻引爆 → 即劉老師回報的 dev 記憶體成長。修法：加 `disposed` 旗標貫穿 connect/onopen/onmessage/onclose/onerror/poll；cleanup 設 disposed=true + 先解除 ws 四個 handler 再 close()（雙保險）+ 清 timer/interval；initial REST fetch 加 cancelled guard。**suspect #1**：TCard/CompactTile 加 React.memo + 自訂 areEqual（只比渲染欄位 + lang prop），父層因非資料因素 re-render（檢視模式/健康輪詢/modal）時跳過 14 張 SVG 重繪；onClick/tr 刻意排除（onClick stale 由 App liveTurbine 以 id 反查保證、tr 由 lang 純函式保證、theme 走 context 不受 memo 影響）。Verify：tsc 0 errors + vite build 748 modules / ~3.4s 0 errors；backend 完全未動（zero regression，frontend only）。Code review 1 must（onClick stale，判定非 bug — App.tsx:143-146 以 id 反查）+ 2 should（onerror 加 disposed guard 採納；compactTileEqual 補 turState 不採納 — 不渲染該欄位）+ 1 nice（history reference 比較，判定 reviewer 誤判情境、不採納）。issue 維持 in_progress（24h 記憶體 < 50% 驗收需劉老師本機長跑）；issue_stats 不變 open 14 / done 43 / total 57。M4 維持 100%。下次候選：WMOM-20260519-01（需劉老師 walkthrough）/ M5 規劃（RAG 需架構決策）/ WMOM-20260513-02 demo orchestrator / 前端測試基礎設施（vitest+RTL）。詳細 handoff 在 work-logs/2026-05/2026-05-24-frontend-realtime-memory-fix.md."
