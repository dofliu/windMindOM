next_milestone: "**WMOM-20260527-02 done — 修復並發 dispatch flaky 測試：實作 BEGIN IMMEDIATE 寫入序列化**：本日第二個 autonomous daily worker session（5/27-01 cost pinned 容差已 merge）。preflight 撞到 5/27-01 修完後 baseline 唯一剩的紅燈 test_concurrent_dispatch_one_loses_when_stock_short（連跑 5 次 3 pass / 2 fail，約 40% flaky）。**root cause**：dispatch_request() 對庫存做 read-modify-write（SELECT stock → 算 → UPDATE 扣），pysqlite 預設 BEGIN DEFERRED 把寫鎖延後到第一次 UPDATE 才取得、with_for_update() 在 SQLite 又是 no-op → 兩個並發 dispatch 各 SELECT 到同一份 stock=5、各扣 4 都 commit → lost update / 超扣（兩個都成功但庫存只夠一個）。inventory_repository.py:105 docstring 與 A2 acceptance 早已聲稱靠『BEGIN IMMEDIATE + WAL + busy_timeout 序列化』但 _get_engine 從未真的接上 —— 文件聲稱卻未實作的 invariant。**修法**：全 workflow repo（work_order/inventory/material_request/signoff）共用的 _get_engine 套 SQLAlchemy 官方 pysqlite serializable recipe —— connect listener 設 isolation_level=None（關 driver 自動 BEGIN）+ 新增 begin listener 發 BEGIN IMMEDIATE（transaction 一開始 grab RESERVED 寫鎖，第二個並發交易被 busy_timeout 5s 擋到第一個 commit 後放行，屆時讀到已扣減 stock → 正確 raise InsufficientStock；WAL 仍允許並發讀，只序列化寫入，符合 single-farm 單機正確性）。補 1 支直接斷言 driver 設定（isolation_level=None + begin listener 已註冊）的 regression test 防退化。**Verify**：該 flaky test 連跑 20/20 pass（改前約 60%）；完整 backend 569 passed / 1 xfailed 連跑 3 次確定性；tests/（含 e2e + physics）151 passed 零 regression → baseline 自此完全綠且確定性。與 WMOM-20260509-F6（PostgreSQL row-lock，M6）正交，本 PR 不碰 PG。issue_stats open 13 / in_progress 1 / done 45→46 / total 59→60。M4 維持 100%。下次候選：WMOM-20260519-01（需劉老師會計語意決策）/ WMOM-20260513-02 demo orchestrator / 擴大元件層測試（CostPage / FarmOverview）/ A6 領料 + A7 庫存 frontend。詳細 handoff 在 work-logs/2026-05/2026-05-27-dispatch-begin-immediate.md."
