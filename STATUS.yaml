next_milestone: "**WMOM-20260519-01 done — `add_return` 超量退料 domain guard（F1 follow-up）**：今日（autonomous daily worker, 5/19 20:00 第二場 session）接續早場 F1 完成的 ledger offset entry，封堵 F1 docstring 標註的「caller 責任」會計邊界。`MaterialRequestRepository.add_return` 加 domain guard 阻擋超量退料。**Code review 揭露關鍵 semantic 修正**：原以為 `actual_qty` 是 wo finish 耗用量，實際上是 `receive` transition 簽收量；因此 formula 從錯誤的 `estimated - consumed - returned`（subtraction，會誤殺 full-receive-then-surplus-return 合法場景）改為正確的 `physical_ceiling = (actual_qty if set else estimated_qty)` per-line aggregate（replacement），跨 stock_kind / return_to_kind 聚合 by (request_id, item_id) 支援 cross-kind return。helper 改名 `_assert_return_within_physical_ceiling`；違反 raise `MaterialRequestRuleViolation` → router 自動 422，error message 改繁體中文（CLAUDE.md §7）；item 不在 MR 也擋（avoid phantom inventory）；MR row `SELECT FOR UPDATE` 序列化並發 callers（race 修正）。11 個新 test 涵蓋 negative path（單次/累進/已簽收後/未在 MR/DRAFT-MR 各超量）+ happy path（pre-receive 全退 / received-ceiling 內退 / surplus-after-full-receive / cross-kind 聚合 / multi-line 聚合 / atomic 三邊不變含累計斷言）+ 修正 2 個既有 buggy test（estimated_qty 1→3 / actual=5→4）。Backend 555 passed (+11 new) + 1 xfailed + 4 pre-existing baseline failures（1 SQLite WAL flaky 沙箱限制 + 3 numpy drift） — **zero regression**。Code-reviewer subagent 跑出 3 must-fix + 6 should-fix + 3 nice-to-have，**採納 9/12**（含 must-fix #1 actual_qty semantic 修正 + must-fix #2 row lock + must-fix #3 DRAFT explicit test；開 follow-up WMOM-20260519-02 補 `_guard_receive` `actual_qty <= estimated_qty` 上限校驗）。M4 維持 100%；issue_stats open 19→19（-1 +1 net）/ done 37→38。下次候選：WMOM-20260519-02（30min easy clean-up）/ F2-F5 一次清掉 / M5 規劃 / WMOM-20260513-02 demo orchestrator simulator。詳細 handoff 在 work-logs/2026-05/2026-05-19-wmom-20260519-01-over-return-guard.md."

# 舊 note（5/19 早場 F1）:
prev_milestone: "**WMOM-20260509-F1 done — `add_return` 寫 ledger offset entry，修月報退料偏高會計漏洞**：今日（autonomous daily worker, 5/19 20:00）從 mr-item-sku-name handoff 推進 F1-F6 候選中商業價值最高的 F1。`MaterialRequestRepository.add_return()` 從 atomic 二寫（stock + MaterialReturn）升級為三寫（+ ledger offset entry）。Offset entry 設計：`amount=-(qty × locked_unit_cost from dispatch entry)`，`status=CONFIRMED + confirmed_at=now`（退料是 actual cash flow），`source_item_id=MaterialReturn.id` 區隔 dispatch entry 的 mr_item.id 避開 wo finish hook `find_for_mr_item` 多筆 collision。新加 `_lookup_offset_unit_cost(sess, request_id, item_id, return_to_kind) -> Decimal | None` static method：先找 dispatch ledger entry 取 locked_unit_cost（會計一致性 — dispatch 後漲價也用鎖定值）→ fallback 查當前 inventory.unit_cost → 都沒則 warning + skip ledger（stock + MaterialReturn 仍寫）。Cross-kind return（dispatch NEW → return USED 試裝後歸二手）docstring + test 涵蓋。17 個新 test（happy path 3 + 月報視角 3 含 mid-state confirmed=-450 + wo hook 互動 1 + fallback 3 + multi 2 + atomic 1 + cross-kind 1 + cross-cutting 2 + N#1）。Backend 551 passed (+17 new) + 1 xfailed + 3 pre-existing numpy drift — **zero regression**。Code-reviewer subagent 找 4 must-fix + 4 should-fix + 3 nice-to-have，**採納 10/11**（含 must-fix #2 開 follow-up issue WMOM-20260519-01 評估超量退料 domain guard：dispatch 2 件 + actual=1 confirm + 退 2 件 → confirmed=-300 負值漏洞，F1 scope 不加 guard 改 docstring 警示）。M4 milestone 維持 100%；issue_stats open 19 → 19（F1 done -1 + WMOM-20260519-01 new +1）/ done 36 → 37。下次候選：WMOM-20260519-01（F1 follow-up，0.5-1d）/ F2-F5 一次清掉（4 個 0.5h）/ M5 規劃 / WMOM-20260513-02 demo orchestrator simulator。詳細 handoff 在 work-logs/2026-05/2026-05-19-f1-add-return-ledger-offset.md."
