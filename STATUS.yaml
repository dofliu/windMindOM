next_milestone: "**A2 (WMOM-20260509-02) 同日完工 — M4 核心雙寫交易就位**：7 SQLAlchemy ORM + cost_ledger 共用 Base + InventoryRepository (CRUD + safety_stock + adjust + audit log) + MaterialRequestRepository (CRUD + state transition + **atomic dispatch_request** + add_return)。58 new tests pass（inventory 21 + MR 19 + **atomic dispatch 18**），workflow 全 291 pass / cost+workflow 348 pass 0 regression。Atomic dispatch 5 條驗收：happy + multi-item / state mismatch / insufficient_stock 全 rollback / mock mid-failure 全 rollback / 並發 2 thread 自動序列化（5 stock × 2 dispatchers 各 4 個 → 1 成功 1 InsufficientStock，無 double-spend）。設計決策：cost_ledger 共用 workflow Base（atomic 必要 — 跨 module 耦合 trade-off）/ SQLite SELECT FOR UPDATE 是 no-op 但 BEGIN IMMEDIATE+WAL+busy_timeout 序列化寫入足以 atomic / dispatch_request 不走 transition('dispatch') 避免 caller 漏掉雙寫 / 工單 material_request_ids 用 reverse-lookup（list_for_work_order）不持久化 list[UUID] / add_return 暫不寫 ledger 沖銷（A5 finish hook 用 actual vs estimated 一次到位）。下一步：A3 (WMOM-20260509-03) MaterialRequest CRUD + state transitions API（9 endpoints + schemas + integration with approval_router 的 MATERIAL_REQUEST 分支，0.5 工作天）。"
