next_milestone: "**WMOM-20260519-01 done — `add_return` 超量退料 domain guard（F1 follow-up）**：今日（autonomous daily worker, 5/19 20:00）從 F1 wrap-up handoff 推進 fresh-in-mind 的 WMOM-20260519-01。加 `MaterialRequest.compute_returnable_upper_bound(item_id) -> int` 純 domain method = `max(0, dispatched_total − consumed_total)`（dispatched=Σ estimated_qty matching item_id、consumed=Σ actual_qty where set）；repository `add_return` 內加 `int(SUM MaterialReturn.qty)` 為 `already_returned`，guard `already_returned + qty <= upper_bound` 違反 raise `MaterialRequestRuleViolation` → router 422，stock + ledger + MR.status 全不動。Cross-kind 退料（dispatch NEW、退 USED）視為同一 item_id 物理進出帳，不 group by stock_kind。F1 邊界場景（dispatched=2 / receive actual_qty=1 / return 2）被擋下 → 月報 confirmed 視角不再可能變 -300。15 個新 test：5 個 domain pure（dispatched only / consumed subtracts / multi-line cross-kind aggregate / unknown item_id / consumed > dispatched floor at 0）+ 9 個 repo guard（qty exceeds raise / boundary equal allowed / F1 邊界 / cumulative already-returned blocking 2nd / cross-kind aggregate / no matching item / 月報視角 / unknown MR LookupError / qty=0 早擋）+ 1 router 422 integration。2 個既有 test 修補（`test_add_return_increments_stock` estimated 1→2、`test_metadata_after_add_return` actual_qty 5→4 — 與新 guard 對齊更貼近實務）。Backend 560 passed (+15 new) + 1 xfailed + 3 pre-existing numpy drift — **zero regression**；e2e/ 6 個 lifecycle 全 pass。Code-reviewer subagent 跑出 1 must-fix + 3 should-fix + 2 nice-to-have，**採納 3/6**（int cast + router test 改 sys.modules + test count 對齊）；must-fix #1 是 DRAFT add_return 仍會 stock += qty 漏洞（cost ledger 已被 F1 自動沖銷，但 stock 層 leak），**out-of-scope** 改開 follow-up issue WMOM-20260519-02 評估 status guard（影響 F1 fallback test 場景需獨立 PR 處理）。M4 milestone 維持 100%；issue_stats open 19 → 19（WMOM-20260519-01 done -1 + WMOM-20260519-02 new +1）/ done 37 → 38。下次候選：WMOM-20260519-02（status guard，0.5-1d）/ F2-F5 一次清掉（4 個 0.5h）/ M5 規劃 / WMOM-20260513-02 demo orchestrator simulator。詳細 handoff 在 work-logs/2026-05/2026-05-19-wmom-20260519-01-add-return-over-quantity-guard.md."
