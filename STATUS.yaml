next_milestone: "**🎉 M4 backend 100% — A8 Reporting backend (PDF 月報 + 年度預算) 完工 + code review 全收**：A8 一日推完（kpi_calculator pure-agg / monthly_report Jinja2 HTML inline CSS + reportlab PDF / annual_budget 12 個月 forecast / reporting_router 3 endpoints）+ code-reviewer subagent 找出 4 must-fix + 4 should-fix 全修 + 8 個 regression test。新增 56 個 reporting tests，全 backend：446 → **502 passed, 1 xfailed (zero regression)**。Reporting 主要產出：(1) `POST /api/reporting/monthly?format=pdf|html|json` 月報 PDF，4 區塊（KPI / cost / WO 統計 / availability）+ 重大事件 timeline；(2) `POST /api/reporting/annual-budget?format=pdf|json` 12 個月 budget forecast，過去用 confirmed actual / 當月用 actual_partial（解耦 forecast 避免低估）/ 未來月用 3-month rolling 歷史平均；(3) `GET /api/reporting/templates` 列出可用 template。Review fix 重點：(a) `in_progress` WO 跨月不再雙計（用 `open_states()` + `closed_at` 上下界）；(b) `actual_partial` 區隔讓當月 forecast 與 partial actual 解耦；(c) Content-Disposition header injection 防護（`_safe_filename_token`）；(d) 共用 WO snapshot 避免雙倍 DB query；(e) `_pdf_styles.py` 共用 reportlab style 跨 monthly/annual 兩個 PDF。設計選用 reportlab（劉老師 Windows weasyprint 撞 Pango DLL）+ HTML preview inline CSS（避免 API endpoint 載不到外部 .css）。M6 客戶第一份月報 demo-ready。下一步候選：A6/A7 frontend 領料庫存頁、A9 frontend reports 頁、A10 E2E lifecycle test、F1-F6 follow-up。"
