next_milestone: "**WMOM-20260504-13 done — Cost 系列 fetch 加 AbortController 防 React 18 Strict Mode race**：今日（autonomous daily worker, 5/23 20:00）認領 5/22 handoff 推薦的 0.25d single-session 小工。原 reviewer finding（WMOM-10 code-review #5）：`useCostData.useAsync.run` 沒 abort 機制 → React 18+ Strict Mode dev mount→unmount→mount 觸發兩次 fetch，慢 fetch 後回會用舊 dataset 結果蓋新 dataset；用戶手動快速切 dataset 也撞同樣 race。解法走原生 AbortController：`frontend/services/costService.ts` 的 `postJSON` 加第 3 參 `signal?: AbortSignal` 傳給 fetch；`costApi.{forecast,lcoe,monteCarlo,varFluct}` 各加第 2 參 `opts?: { signal? }`；`frontend/hooks/useCostData.ts` 的 `useAsync` 用 `useRef<AbortController | null>` 持有當前 controller，每次 run abort 上一輪並建新的；catch 內 `isAbortError(e) || signal.aborted` 走靜默 return（不寫 error state、不關 loading，由新一輪接管）；finally 用 `controllerRef.current === controller && !aborted` guard 才動 loading（防止新一輪剛 setLoading(true) 被 stale finally 蓋）；useEffect cleanup unmount 時 abort in-flight。Code reviewer must-fix [1]（unmount 路徑 loading leak 注釋）+ should-fix [2]（**reset() 也要 abort in-flight** — 真實 UX bug：dataset 切換時 CostPage 對非 forecast panel 呼叫 reset，若有 in-flight 會用舊結果蓋掉剛清空的視覺）+ should-fix [3]（useCallback fn dep 穩定性說明）+ 3 nice 全採納。frontend 無 vitest 設施 → 驗證走 `npx tsc --noEmit` clean + `npx vite build` clean（917 kB / 265 kB gzip，與 main 一致）；backend zero regression（564 passed + 1 xfailed，deselect 5 個 pre-existing env-flaky 與本 PR 完全無關 = 純 frontend 改動）。M5 仍 0%；M1-M4 進度不動；issue_stats open 15→14 / done 42→43 / total 57 不變。下次候選：WMOM-20260519-01（F1 超量退料 domain guard，需設計決策 — 不適合 solo session）/ M5 規劃（讀 ROADMAP M5 章節決定第一個 issue）/ WMOM-20260513-02 demo orchestrator simulator（2-3d 跨 session）/ WMOM-20260504-12 frontend 長期記憶體成長觀察。詳細 handoff 在 work-logs/2026-05/2026-05-23-cost-abort-controller.md."
