next_milestone: "**WMOM-20260524-01 done — Frontend 測試基礎設施（vitest + RTL）+ 回補 race-condition regression test**：今日（autonomous daily worker, 5/24 20:00）做連續 3 次 handoff 推薦的「新 issue 候選」。前端原本完全無測試框架，導致 5/23（useCostData AbortController race）+ 5/24（useRealtimeData WS 殭屍重連 leak）兩次修復都無法補自動化 regression。本 session 導入 vitest@^3 + jsdom@^29 + @testing-library/react@^16（+ @testing-library/dom），建 frontend/vitest.config.ts（與 vite.config.ts 分離；jsdom env / include **/*.test.{ts,tsx} / setupFiles / restoreMocks）+ vitest.setup.ts（afterEach RTL cleanup，explicit import 不依賴 globals 故不動 tsconfig）+ package.json scripts（test=vitest run / test:watch）。**回補兩個近期 race-condition fix 的 regression**：useRealtimeData.test.ts（FakeWebSocket + fake timer，test1 鎖「卸載後解除 4 handler 再 close、模擬 emitClose + 推進 10s 仍只有 1 條 WS（殭屍重連回歸即 fail）」、test2 反向保證「掛載中斷線 3s 後重連未被 disposed guard 誤殺」）；useCostData.test.ts（vi.mock costApi + 可控 deferred，test1 驗「run(A)→run(B) 後 B abort A 的 controller、先 resolve B 再 resolve A → data 始終 B（stale 不蓋 fresh）」、test2 驗「A reject DOMException('AbortError') → error 仍 null」）。Verify：npx vitest run 4 passed / npx tsc --noEmit 0 errors（含測試檔）/ npx vite build 748 modules 0 errors（測試檔正確排除於 bundle 外，module 數同 baseline）；backend 未動 zero backend regression（開工 baseline 566 passed / 1 xfailed / 3 pre-existing numpy BLAS drift，非 regression）。Code review 採納記於 PR。issue_stats done 43→44 / total 57→58（新建即完成，open 不變 13；WMOM-20260504-12 仍 in_progress 待劉老師 24h 記憶體長跑驗收，本次新增 useRealtimeData.test.ts 已替其修法上自動化守門）。M4 維持 100%。下次候選：WMOM-20260519-01（需劉老師 walkthrough）/ M5 規劃（RAG 需架構決策 + 外部依賴）/ WMOM-20260513-02 demo orchestrator（2-3d 跨 session）/ 元件層測試擴充（FarmOverview memo / CostPage panel，接續本 infra）。詳細 handoff 在 work-logs/2026-05/2026-05-24-frontend-test-infra.md."
