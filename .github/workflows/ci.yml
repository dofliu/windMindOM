name: CI

# windMindOM CI — autonomous worker 飛輪的測試閘門（WMOM-20260603-02）。
# 每個 PR（及 merge 進 main 的 push）都自動跑 backend pytest + frontend
# vitest/tsc/build。CI 全綠是 auto-merge.yml 自動合併 bot PR 的前提。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支新 push 取消還在跑的舊 run，省 runner、加快回饋。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest（5 module + monitoring/physics + e2e）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝依賴（runtime + dev）
        run: pip install -r requirements.txt -r requirements-dev.txt
      # 涵蓋全 5 module + monitoring/physics 迴歸防護（tests/ 含 physics
      # 一致性 + e2e lifecycle + farm registry + dev_mode）。monitoring 是
      # 最大且物理最敏感的模組，先前未進 CI；改壞物理一致性 CI 不會擋 →
      # 補上以符合「不要破壞既有物理一致性」守則。
      - name: pytest（全 backend + physics/e2e）
        run: >-
          python -m pytest
          modules/workflow/tests/
          modules/cost/tests/
          modules/reporting/tests/
          modules/knowledge/tests/
          modules/monitoring/tests/
          tests/
          -q

  frontend:
    name: Frontend vitest + tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝依賴
        run: npm ci
      - name: 型別檢查
        run: npx tsc --noEmit
      - name: 單元測試（baseline 59 passed）
        run: npx vitest run
      - name: production build
        run: npx vite build
